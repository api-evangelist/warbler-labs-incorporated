name: Warbler Labs Incorporated
description: Warbler Labs is the San Francisco-based software company founded in 2020 by former Coinbase
  engineers Blake West and Mike Sall that builds and maintains Goldfinch, a decentralized credit protocol
  on Ethereum for stablecoin lending to real-world borrowers without crypto collateral, and UID (Unique
  Identity), a KYC/KYB-compliant on-chain identity credential. Warbler Labs is the core development team
  behind the Goldfinch protocol, its smart contracts, oracles, and subgraph data layer, and publishes
  developer documentation for building on and integrating with the protocol. The company is backed by
  Andreessen Horowitz (a16z), Coinbase Ventures, IDEO CoLab, Kindred Ventures, and others, and was surfaced
  through the a16z portfolio. Its developer surface is primarily on-chain (Solidity smart contracts, The
  Graph subgraph for querying protocol data, and the UID credential) rather than a hosted REST API.
